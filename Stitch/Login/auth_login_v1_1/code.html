<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nutrift Cadastro V3 - Padronizado</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                "primary": "#3DA63A",
                "nutrift-bg": "#F5F5F0",
                "pill-bg": "#E8F5E9",
              },
              fontFamily: {
                "sans": ["DM Sans", "sans-serif"],
                "syne": ["Syne", "sans-serif"]
              },
              borderRadius: {
                "2xl": "24px",
                "xl": "12px",
              },
            },
          },
        }
    </script>
<style type="text/tailwindcss">
        .gradient-logo {
            background: linear-gradient(135deg, #3DA63A 0%, #2e7d32 100%);
        }
        .btn-gradient {
            background: linear-gradient(180deg, #3DA63A 0%, #2e7d32 100%);
        }
        body {
            background-color: #F5F5F0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-sans antialiased text-slate-900">
<div class="relative flex min-h-screen w-full flex-col items-center justify-start p-6 pt-12">
<div class="flex flex-col items-center mb-8 text-center">
<div class="gradient-logo w-16 h-16 rounded-full flex items-center justify-center shadow-lg mb-4">
<span class="text-white font-syne text-3xl font-extrabold">N</span>
</div>
<h1 class="text-slate-900 font-syne text-2xl font-bold leading-tight">Bem-vindo ao Nutrift</h1>
<p class="text-slate-500 text-sm mt-1">Sua jornada saudável começa aqui</p>
</div>
<div class="w-full max-w-[400px] bg-white rounded-2xl shadow-xl shadow-slate-200/50 p-6">
<div class="flex h-12 w-full items-center justify-center rounded-full bg-[#F5F5F0] p-1 mb-4">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 text-slate-500 text-sm font-medium transition-all">
<span class="truncate">Entrar</span>
<input class="hidden" name="auth-mode" type="radio" value="login"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-4 bg-white shadow-sm text-slate-900 text-sm font-semibold transition-all">
<span class="truncate">Cadastrar</span>
<input checked="" class="hidden" name="auth-mode" type="radio" value="signup"/>
</label>
</div>
<div class="flex items-center justify-center mb-6">
<div class="bg-pill-bg px-4 py-1.5 rounded-full">
<p class="text-primary text-[11px] font-bold tracking-tight">
                        ✓ Grátis · ✓ Sem cartão · ✓ Sem anúncios
                    </p>
</div>
</div>
<form class="space-y-4">
<div class="flex flex-col gap-1.5">
<label class="text-slate-700 text-xs font-bold uppercase tracking-wider ml-1">Nome</label>
<input class="w-full h-12 bg-nutrift-bg border-none rounded-xl px-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-primary/50 transition-all outline-none" placeholder="Seu nome completo" type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-slate-700 text-xs font-bold uppercase tracking-wider ml-1">E-mail</label>
<input class="w-full h-12 bg-nutrift-bg border-none rounded-xl px-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-primary/50 transition-all outline-none" placeholder="seu@email.com" type="email"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-slate-700 text-xs font-bold uppercase tracking-wider ml-1">Senha</label>
<div class="relative">
<input class="w-full h-12 bg-nutrift-bg border-none rounded-xl px-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-primary/50 transition-all outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-slate-700 text-xs font-bold uppercase tracking-wider ml-1">Confirmar senha</label>
<div class="relative">
<input class="w-full h-12 bg-nutrift-bg border-none rounded-xl px-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-primary/50 transition-all outline-none" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full h-14 btn-gradient text-white font-bold rounded-full shadow-lg shadow-primary/20 active:scale-[0.98] transition-all mt-4 flex items-center justify-center gap-2" type="submit">
                    Criar conta grátis
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<div class="relative my-6 flex items-center">
<div class="flex-grow border-t border-slate-100"></div>
<span class="mx-4 text-slate-400 text-[10px] font-bold uppercase tracking-widest">ou</span>
<div class="flex-grow border-t border-slate-100"></div>
</div>
<div class="flex flex-col gap-3">
<button class="flex items-center justify-center gap-3 w-full h-12 bg-black text-white rounded-full font-semibold hover:bg-slate-900 transition-colors">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.06 1.92-3.4 1.92s-1.74-.77-3.25-.77c-1.52 0-2.03.75-3.32.77-1.34.02-2.58-1.09-3.61-2.12C1.4 18.02.16 14.5.16 11.4c0-4.69 3.12-7.14 6.13-7.14 1.58 0 2.87.97 3.79.97.93 0 2.41-1.12 4.29-1.12 1.96 0 3.51.98 4.45 2.11-3.66 1.83-3.04 7.22.42 8.76-.84 2.14-2.23 4.35-3.19 5.3zM13.63 3.65c-.84 1.02-1.95 1.76-3.14 1.63.15-1.18.84-2.31 1.76-3.16 1.02-.9 2.21-1.6 3.29-1.5.12 1.25-.66 2.37-1.91 3.03z"></path>
</svg>
<span>Cadastrar com Apple</span>
</button>
<button class="flex items-center justify-center gap-3 w-full h-12 bg-white border border-slate-200 text-slate-700 rounded-full font-semibold hover:bg-slate-50 transition-colors">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span>Cadastrar com Google</span>
</button>
</div>
</div>
<div class="mt-8 text-center px-6">
<p class="text-slate-400 text-[11px] leading-relaxed mb-4">
                Ao continuar, você concorda com nossos <a class="text-slate-600 underline" href="#">Termos de Uso</a> e <a class="text-slate-600 underline" href="#">Política de Privacidade</a>.
            </p>
<p class="text-slate-600 text-sm">
                Já tem conta? <a class="text-primary font-bold hover:underline" href="#">Entrar</a>
</p>
</div>
</div>

</body></html>
