<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nutrift Login V3 - Padronizado</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nutrift-bg': '#F5F5F0',
                        'nutrift-border': '#EBEBEB',
                        'nutrift-green-light': '#7DC95E',
                        'nutrift-green-dark': '#3DA63A',
                    },
                    fontFamily: {
                        'syne': ['Syne', 'sans-serif'],
                        'dm-sans': ['DM Sans', 'sans-serif'],
                    },
                    borderRadius: {
                        '24px': '24px',
                        '12px': '12px',
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .logo-gradient {
                background: linear-gradient(135deg, #7DC95E 0%, #3DA63A 100%);
            }
            .btn-gradient {
                background: linear-gradient(180deg, #7DC95E 0%, #3DA63A 100%);
            }
            .green-shadow {
                box-shadow: 0 10px 20px -5px rgba(61, 166, 58, 0.3);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-nutrift-bg font-dm-sans antialiased text-slate-900">
<div class="min-h-screen flex flex-col items-center justify-center p-6 max-w-md mx-auto">
<header class="flex flex-col items-center mb-8 text-center">
<div class="logo-gradient w-16 h-16 rounded-full flex items-center justify-center shadow-sm mb-6">
<span class="text-white font-syne text-[32px] font-bold">N</span>
</div>
<h1 class="font-syne text-[26px] font-bold text-slate-900 tracking-tight">Bem-vindo ao Nutrift</h1>
<p class="text-[14px] font-light text-slate-500 mt-1">Nutrição inteligente para resultado real</p>
</header>
<main class="w-full bg-white rounded-24px border border-nutrift-border p-6 shadow-sm">
<div class="bg-nutrift-border p-1 rounded-full flex items-center mb-8">
<button class="flex-1 bg-white text-slate-900 text-sm font-semibold py-2.5 rounded-full shadow-sm">
                    Entrar
                </button>
<button class="flex-1 text-slate-500 text-sm font-medium py-2.5 rounded-full">
                    Cadastrar
                </button>
</div>
<form class="space-y-5" onsubmit="return false;">
<div class="space-y-1.5">
<label class="text-[13px] font-semibold text-slate-700 ml-1">E-mail</label>
<input class="w-full bg-nutrift-bg border-none rounded-12px h-[54px] px-4 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-nutrift-green-light transition-all outline-none" placeholder="seu@email.com" type="email"/>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-[13px] font-semibold text-slate-700">Senha</label>
<a class="text-[12px] font-semibold text-nutrift-green-dark hover:opacity-80 transition-opacity" href="#">Esqueci minha senha</a>
</div>
<div class="relative">
<input class="w-full bg-nutrift-bg border-none rounded-12px h-[54px] px-4 pr-12 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-nutrift-green-light transition-all outline-none" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<button class="w-full btn-gradient text-white font-bold h-[54px] rounded-full green-shadow active:scale-[0.98] transition-all mt-2" type="submit">
                    Entrar
                </button>
</form>
<div class="flex items-center my-8">
<div class="flex-1 h-px bg-nutrift-border"></div>
<span class="px-4 text-[11px] font-medium text-slate-400 uppercase tracking-widest">ou continue com</span>
<div class="flex-1 h-px bg-nutrift-border"></div>
</div>
<div class="space-y-3">
<button class="w-full flex items-center justify-center gap-3 bg-black text-white h-[52px] rounded-full font-semibold hover:bg-zinc-900 transition-colors">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.06 1.92-3.4 1.92s-1.74-.77-3.25-.77c-1.52 0-2.03.75-3.32.77-1.34.02-2.58-1.09-3.61-2.12C1.4 18.02.16 14.5.16 11.4c0-4.69 3.12-7.14 6.13-7.14 1.58 0 2.87.97 3.79.97.93 0 2.41-1.12 4.29-1.12 1.96 0 3.51.98 4.45 2.11-3.66 1.83-3.04 7.22.42 8.76-.84 2.14-2.23 4.35-3.19 5.3zM13.63 3.65c-.84 1.02-1.95 1.76-3.14 1.63.15-1.18.84-2.31 1.76-3.16 1.02-.9 2.21-1.6 3.29-1.5.12 1.25-.66 2.37-1.91 3.03z"></path>
</svg>
<span>Entrar com Apple</span>
</button>
<button class="w-full flex items-center justify-center gap-3 bg-white border border-nutrift-border text-slate-700 h-[52px] rounded-full font-semibold hover:bg-slate-50 transition-colors">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span>Entrar com Google</span>
</button>
</div>
</main>
<footer class="mt-8 text-center px-4">
<p class="text-[11px] leading-relaxed text-slate-400 mb-6">
                Ao continuar, você concorda com nossos <a class="text-slate-600 underline" href="#">Termos de Uso</a> e <a class="text-slate-600 underline" href="#">Política de Privacidade</a>.
            </p>
<p class="text-[14px] text-slate-600">
                Não tem conta? <a class="text-nutrift-green-dark font-bold hover:underline" href="#">Cadastrar grátis</a>
</p>
</footer>
</div>

</body></html>
