<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3DA63A",
                        "background-light": "#F5F5F0",
                        "background-dark": "#122210",
                        "accent-green": "#3DA63A",
                        "gradient-start": "#7DC95E",
                        "gradient-end": "#3DA63A",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .progress-gradient {
                background: linear-gradient(90deg, #7DC95E 0%, #3DA63A 100%);
            }
            .cta-gradient {
                background: linear-gradient(180deg, #7DC95E 0%, #3DA63A 100%);
            }
            .shadow-soft-green {
                box-shadow: 0 8px 20px -4px rgba(61, 166, 58, 0.4);
            }
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #F5F5F0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F5F5F0] dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<div class="relative flex h-[844px] w-full max-w-[390px] flex-col bg-[#F5F5F0] dark:bg-background-dark overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-[#EBEBEB] dark:bg-slate-800">

</div>
<div class="flex items-center justify-between px-6 pt-8 pb-2">
<button class="flex items-center justify-center w-[36px] h-[36px] rounded-full bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-[20px] text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
<div class="text-right">

            </p>

</div>

</div>

</div>

</div>

</div>

</div>
</div>
</div>
<div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#F5F5F0] via-[#F5F5F0] to-transparent dark:from-background-dark dark:via-background-dark/95">

<span class="material-symbols-outlined text-white">arrow_forward</span>
</button>
</div>
<div class="absolute -top-20 -right-20 size-64 bg-[#3DA63A]/5 blur-[100px] rounded-full -z-10"></div>
<div class="absolute -bottom-20 -left-20 size-64 bg-[#3DA63A]/5 blur-[100px] rounded-full -z-10"></div>
</div>
